apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-backend
  labels:
    app: api-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-backend
  template:
    metadata:
      labels:
        app: api-backend
    spec:
      containers:
      - name: api
        image: node:18-alpine
        ports:
        - containerPort: 3000
        env:
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: host
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: port
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: postgres-config
              key: database
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: NODE_ENV
        - name: API_PORT
          valueFrom:
            configMapKeyRef:
              name: api-config
              key: API_PORT
        command: ["/bin/sh"]
        args: 
        - -c
        - |
          apk add --no-cache postgresql-client
          npm init -y > /dev/null 2>&1
          npm install express pg cors > /dev/null 2>&1
          cat > app.js << 'EOFAPP'
          const express = require('express');
          const { Pool } = require('pg');
          const cors = require('cors');

          const app = express();
          const port = process.env.API_PORT || 3000;

          // Configuración de la base de datos
          const pool = new Pool({
            host: process.env.DB_HOST,
            port: process.env.DB_PORT,
            database: process.env.DB_NAME,
            user: process.env.DB_USER,
            password: process.env.DB_PASSWORD,
          });

          // Middleware
          app.use(cors());
          app.use(express.json());

          // Inicializar base de datos
          async function initDB() {
            try {
              await pool.query(`
                CREATE TABLE IF NOT EXISTS tareas (
                  id SERIAL PRIMARY KEY,
                  titulo VARCHAR(255) NOT NULL,
                  completada BOOLEAN DEFAULT FALSE,
                  fecha_creacion TIMESTAMP DEFAULT CURRENT_TIMESTAMP
                )
              `);
              console.log('✅ Tabla de tareas inicializada');
              
              // Insertar datos de ejemplo si la tabla está vacía
              const result = await pool.query('SELECT COUNT(*) FROM tareas');
              if (parseInt(result.rows[0].count) === 0) {
                await pool.query(`
                  INSERT INTO tareas (titulo) VALUES 
                  ('Aprender Kubernetes'),
                  ('Desplegar aplicación con StatefulSet'),
                  ('Configurar ConfigMaps y Secrets')
                `);
                console.log('✅ Datos de ejemplo insertados');
              }
            } catch (err) {
              console.error('❌ Error inicializando BD:', err);
            }
          }

          // Rutas de la API
          app.get('/api/health', (req, res) => {
            res.json({ 
              status: 'OK', 
              pod: process.env.HOSTNAME,
              timestamp: new Date().toISOString(),
              message: 'API de Tareas funcionando correctamente'
            });
          });

          app.get('/api/tareas', async (req, res) => {
            try {
              const result = await pool.query('SELECT * FROM tareas ORDER BY fecha_creacion DESC');
              res.json({
                success: true,
                data: result.rows,
                count: result.rows.length,
                pod: process.env.HOSTNAME
              });
            } catch (err) {
              res.status(500).json({ error: err.message });
            }
          });

          app.post('/api/tareas', async (req, res) => {
            try {
              const { titulo } = req.body;
              if (!titulo) {
                return res.status(400).json({ error: 'El título es requerido' });
              }
              const result = await pool.query(
                'INSERT INTO tareas (titulo) VALUES ($1) RETURNING *',
                [titulo]
              );
              res.status(201).json({
                success: true,
                data: result.rows[0],
                message: 'Tarea creada exitosamente'
              });
            } catch (err) {
              res.status(500).json({ error: err.message });
            }
          });

          app.put('/api/tareas/:id', async (req, res) => {
            try {
              const { id } = req.params;
              const { completada } = req.body;
              const result = await pool.query(
                'UPDATE tareas SET completada = $1 WHERE id = $2 RETURNING *',
                [completada, id]
              );
              if (result.rows.length === 0) {
                return res.status(404).json({ error: 'Tarea no encontrada' });
              }
              res.json({
                success: true,
                data: result.rows[0],
                message: 'Tarea actualizada exitosamente'
              });
            } catch (err) {
              res.status(500).json({ error: err.message });
            }
          });

          // Inicializar y empezar servidor
          initDB().then(() => {
            app.listen(port, () => {
              console.log(`🚀 API ejecutándose en puerto ${port}`);
              console.log(`📊 Pod: ${process.env.HOSTNAME}`);
              console.log(`🗄️  BD: ${process.env.DB_HOST}:${process.env.DB_PORT}/${process.env.DB_NAME}`);
            });
          });
          EOFAPP
          node app.js
